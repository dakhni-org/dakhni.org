name: Rebuild editorial audit output

on:
  push:
    branches:
      - chatgpt/editorial-authority-audit

permissions:
  contents: write

concurrency:
  group: rebuild-editorial-audit
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: pip install jsonschema

      - name: Build site and search index
        run: |
          python3 scripts/build_site.py
          python3 scripts/build-search-index.py

      - name: Commit generated output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rebuild generated editorial output [skip ci]"
            git push
          else
            echo "Generated output already up to date."
          fi
