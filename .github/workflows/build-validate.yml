name: Build & Validate
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema
      - name: Apply fact-check corrections on the audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fact-check/site-content-2026-07'
        run: python3 scripts/apply_fact_check_fixes_v2.py
      - name: Validate every content file against the JSON Schema
        run: |
          python3 -c "
          import glob, json, jsonschema, sys
          schema = json.load(open('schemas/page.schema.json'))
          errors = []
          for jf in sorted(glob.glob('content/**/*.json', recursive=True)):
              if jf.endswith('navigation.json'):
                  continue
              d = json.load(open(jf))
              try:
                  jsonschema.validate(d, schema)
              except jsonschema.ValidationError as e:
                  errors.append(f'{jf}: {e.message}')
          if errors:
              print('Schema validation failed:')
              for e in errors:
                  print(f'- {e}')
              sys.exit(1)
          print(f'{len(glob.glob(\"content/**/*.json\", recursive=True))} content files validated against schema')
          "
      - name: Validate and build site
        run: python3 scripts/build_site.py
      - name: Rebuild search index
        run: python3 scripts/build-search-index.py
      - name: Check all pages rendered
        run: |
          count=$(find . -name "index.html" | grep -v node_modules | wc -l)
          echo "Rendered $count pages"
          test "$count" -ge 65
      - name: Commit corrected canonical and generated content
        if: github.event_name == 'pull_request' && github.head_ref == 'fact-check/site-content-2026-07'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply fact-checked content and rebuild site [fact-check-generated]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Fail if committed output is stale
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo "Generated HTML / sitemap.xml / search-index.json don't match what's committed."
            echo "Run 'python3 scripts/build_site.py && python3 scripts/build-search-index.py' and commit the result."
            git diff --cached --stat
            exit 1
          fi
          echo "Committed generated output matches a fresh build."
