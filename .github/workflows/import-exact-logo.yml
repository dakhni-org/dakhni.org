name: Import exact SVG logo

on:
  push:
    branches:
      - chatgpt/exact-logo-svg
    paths:
      - '.logo-import/chunk*.txt'
      - '.github/workflows/import-exact-logo.yml'

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify transfer chunks
        run: |
          echo 'd5dba6373092d71be3bde33e564d813fe5df2cd27896eeada178e89d72e782f1  .logo-import/chunk01.txt' | sha256sum -c -
          echo '3900c514b9f8d27ae95f3d9beb64400dfa315ff1c08efbd9aee88d63e1f5aaf5  .logo-import/chunk02.txt' | sha256sum -c -
          echo '87c743913562dc7421b9c3b2265f54b648db0569bf71cd8a5663539573b3b468  .logo-import/chunk03.txt' | sha256sum -c -
          echo '85b145b298b67ba1645c475c7267a1de9f1238dbb55fb1007bd26f24f8076b9a  .logo-import/chunk04.txt' | sha256sum -c -

      - name: Restore uploaded SVG exactly
        run: |
          cat .logo-import/chunk01.txt .logo-import/chunk02.txt .logo-import/chunk03.txt .logo-import/chunk04.txt > /tmp/logo.svg.xz.b64
          base64 -d /tmp/logo.svg.xz.b64 | xz -d > assets/dakhni-org-logo.svg
          actual="$(git hash-object assets/dakhni-org-logo.svg)"
          expected="1e9aa6384558d27614a69e9170c92763de5dfb98"
          echo "SVG git blob: $actual"
          test "$actual" = "$expected"

      - name: Commit exact SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dakhni-org-logo.svg
          if ! git diff --cached --quiet; then
            git commit -m "Use supplied exact SVG logo [skip ci]"
            git push
          fi
