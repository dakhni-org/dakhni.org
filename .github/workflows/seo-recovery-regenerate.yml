name: Regenerate site on SEO recovery branch

on:
  workflow_dispatch:
  push:
    branches:
      - seo-recovery-editorial-quality
    paths:
      - 'content/**'
      - 'scripts/build_site.py'
      - 'schemas/page.schema.json'
      - 'assets/site.css'
      - '.github/workflows/seo-recovery-regenerate.yml'

permissions:
  contents: write

concurrency:
  group: seo-recovery-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build generated site
        run: |
          python3 scripts/build_site.py
          python3 scripts/build-search-index.py

      - name: Commit generated output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Regenerate site for SEO recovery [skip ci]"
            git push
          else
            echo "Generated output already up to date."
          fi
