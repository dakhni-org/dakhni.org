name: Apply Fact Check

on:
  push:
    branches:
      - fact-check/site-content-2026-07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fact-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[fact-check-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install jsonschema
      - name: Apply verified corrections
        run: python3 scripts/apply_fact_check_fixes_v2.py
      - name: Rebuild site and search index
        run: |
          python3 scripts/build_site.py
          python3 scripts/build-search-index.py
      - name: Check generated patch
        run: git diff --check
      - name: Commit generated corrections
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: correct fact-checked site content [fact-check-generated]"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify committed output is reproducible
        run: |
          python3 scripts/build_site.py
          python3 scripts/build-search-index.py
          git diff --exit-code
      - name: Push generated corrections
        if: steps.commit.outputs.has_changes == 'true'
        run: git push
