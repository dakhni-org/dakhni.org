name: SEO branch build helper

on:
  push:
    branches:
      - chatgpt/seo-recovery-content-depth

permissions:
  contents: write

concurrency:
  group: seo-branch-build-helper
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/seo-recovery-content-depth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: pip install jsonschema
      - name: Validate content schema
        run: |
          python3 - <<'PY'
          import glob, json, jsonschema
          schema = json.load(open('schemas/page.schema.json'))
          for jf in sorted(glob.glob('content/**/*.json', recursive=True)):
              if jf.endswith('navigation.json'):
                  continue
              jsonschema.validate(json.load(open(jf)), schema)
          print('Content schema validation passed')
          PY
      - name: Generate site and search index
        run: |
          python3 scripts/build_site.py
          python3 scripts/build-search-index.py
      - name: Commit generated output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Generate site from SEO source updates [skip ci]"
            git push origin HEAD:chatgpt/seo-recovery-content-depth
          else
            echo "Generated output already current."
          fi
